- title: "AI, household time, and productivity"
  label: "Blog post"
  date: 2026-09-18
  description: "AI is changing how households spend their time, from managing finances and accessing public services to education and menu planning. Diane Coyle, Mihai Codreanu and Arthur Turrell argue that understanding AI’s impact on productivity and the wider economy requires recognising households as both consumers and producers – and measuring what happens to productivity growth in both paid work and domestic activity."
  image: over_under_rep.webp
  links:
  - name: Link
    url: https://www.bennettschool.cam.ac.uk/blog/ai-household-time-productivity/

