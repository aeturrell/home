project:
  type: website

  preview: 
    port: 5555
    browser: true
    watch-inputs: true
    navigate: true

  render:
    - "*.qmd"
    - "*.md"
    - "!etc/"

  pre-render: scripts/github_stats.py
  post-render: scripts/clean_share_titles.py

  resources:
    - "files/**"
    - "etc/**"


freeze: true

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl

# Metadata stuff
description-meta: "Arthur Turrell is an economic data scientist."
author-meta: "Arthur Turrell"
affiliation-meta: "Google"
orcid-meta: 0000-0002-2525-0773

website:
  title: "Arthur Turrell"
  description: "{{< meta description-meta >}}"
  favicon: "/files/logo_large.png"
  site-url: "https://www.aeturrell.com/"
  repo-url: "https://github.com/aeturrell/home"

  google-analytics: "G-46P0B31B3F"

  twitter-card:
    image: "/files/logo_large.png"
    description: "{{< meta description-meta >}}"
    card-style: summary_large_image
    creator: "@arthurturrell"
    site: "@arthurturrell"

  open-graph: 
    image: "/files/logo_large.png"
    description: "{{< meta description-meta >}}"
    locale: en_GB
  
  navbar:
    pinned: true
    collapse-below: xl

    left:
      - text: "Talks and Media"
        href: "media/index.qmd"
      - text: "Research"
        file: research/index.qmd
      - text: "Public Goods"
        menu:
          - text: "Learning"
            href: teaching/index.qmd
          - text: "Code"
            href: code/index.qmd
          - text: "Useful Tidbits"
            href: uses/index.qmd
      - text: "Professional Activities"
        href: talks/index.qmd
      - text: "The Star Builders"
        href: "thestarbuilders/thestarbuilders.qmd"
      - text: "Markov Wanderer (blog)"
        href: blog/index.qmd

    right:
      - icon: rss
        aria-label: rss
        href: atom.xml
      - icon: envelope
        aria-label: contact
        text: " "
        href: contact.qmd

  page-footer:
    left: "This website represents Arthur's personal views."
    right:
      - icon: twitter
        aria-label: twitter
        href: https://twitter.com/arthurturrell
      - icon: bluesky
        aria-label: bluesky
        href: https://bsky.app/profile/arthurturrell.bsky.social
      - icon: github
        aria-label: github
        href: https://github.com/aeturrell
      - icon: linkedin
        aria-label: linkedin
        href: https://www.linkedin.com/in/arthur-turrell-8b789891
      - text: "{{< iconify simple-icons googlescholar >}}"
        aria-label: google scholar
        href: https://scholar.google.com/citations?user=6KoCnQEAAAAJ&hl=en

format:
  html:
    theme:
      - html/ath.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
    highlight-style: monokai
