- title: "Statistics and Stupidly Smart AI—a lecture at the Royal Institution"
  date: 2026-07-11
  description: "Statistics are under pressure! It's harder to count the things that we make today than it was to count the things we used to make. And surveys, once the life-blood of our nation's statistics, are facing steep declines in response rates. This is Bad News for the country as statistics are critical infrastructure, like our roads or water pipes: they are used to make decisions about everything from school funding to taxes. What can we do? In this talk I'm going to show you how clever use of artificial intelligence can help to improve statistics and take the pulse of the nation in new ways. We'll see AI track traffic, predict the future, and work out if you’re doing the dishes, all in the name of better data. Like all technologies, AI can be good or bad. So we'll also see how AI is only 'stupidly smart': like a mischievous genie, you have to be very careful what you wish for. And, to cap it all off, I'll let you in on the secret of how AI could win you millions of dollars."
  video: "https://www.youtube.com/embed/G0CYIphesDg"

- title: "Royal Statistical Society William Guy Lecture: Economic statistics and stupidly smart AI"
